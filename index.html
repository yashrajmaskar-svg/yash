<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Love Portal 🌌</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  color: #fff;
  background: #02030a;
  font-family: "Noto Sans Devanagari", "Mangal", Arial, sans-serif;
  overflow-x: hidden;
}

button {
  padding: 13px 22px;
  margin: 7px;
  color: white;
  border: 1px solid #b8a0ff;
  border-radius: 30px;
  background: linear-gradient(110deg,#6333df,#c33ebc);
  font-size: 15px;
  cursor: pointer;
  box-shadow: 0 0 22px #8a43ff55;
  transition: .25s;
}

button:hover { transform: scale(1.04); }
button:disabled { opacity: .5; }

#stars {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-image:
    radial-gradient(2px 2px at 30px 40px,#fff,transparent),
    radial-gradient(1px 1px at 120px 130px,#b4d9ff,transparent),
    radial-gradient(2px 2px at 230px 70px,#e5c5ff,transparent),
    radial-gradient(1px 1px at 300px 210px,#fff,transparent);
  background-size: 330px 300px;
  animation: starsMove 45s linear infinite;
}

@keyframes starsMove {
  from { background-position: 0 0; }
  to { background-position: 330px 600px; }
}

.page {
  position: relative;
  z-index: 1;
  min-height: 100vh;
  padding: 25px 15px 40px;
  text-align: center;
}

h1 {
  font-size: clamp(32px,6vw,52px);
  text-shadow: 0 0 25px #a66bff;
}

.subtitle {
  color: #d4c9f6;
  line-height: 1.9;
}

/* REALISTIC-STYLE BLACK HOLE */

.portal {
  height: 370px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  perspective: 700px;
}

.blackhole {
  position: relative;
  width: 220px;
  height: 220px;
  border-radius: 50%;
  background:
    radial-gradient(circle,
      #000 0 25%,
      #010104 31%,
      #080611 38%,
      transparent 42%);
  filter: drop-shadow(0 0 28px #ff7b24);
}

.blackhole::before {
  content: "";
  position: absolute;
  inset: 8px -30px;
  border-radius: 50%;
  background: conic-gradient(
    from 15deg,
    transparent 0deg,
    #ffb84d 35deg,
    #fff2bf 55deg,
    #ff7627 80deg,
    #8d38ff 110deg,
    transparent 145deg,
    #ff9c3d 205deg,
    #fff5c8 225deg,
    #ff6726 255deg,
    transparent 300deg
  );
  transform: rotateX(68deg) rotate(-18deg);
  filter: blur(5px);
  box-shadow: 0 0 25px #ff7a27, 0 0 55px #d94e19;
  animation: diskRotate 9s linear infinite;
}

.blackhole::after {
  content: "";
  position: absolute;
  inset: 42px;
  border-radius: 50%;
  background: radial-gradient(circle,#000 0 57%,#030208 68%,transparent 72%);
  box-shadow: 0 0 24px 10px #000, 0 0 50px #ff852755;
}

.lens {
  position: absolute;
  width: 255px;
  height: 110px;
  border-radius: 50%;
  border: 3px solid #ffd5a0;
  transform: rotateX(68deg) rotate(-18deg);
  box-shadow: 0 0 18px #ff8b35, inset 0 0 15px #ff7c2b;
  opacity: .8;
}

.lens.two {
  width: 290px;
  height: 130px;
  border-color: #8f76ff;
  box-shadow: 0 0 18px #6f4aff;
  transform: rotateX(68deg) rotate(25deg);
  opacity: .5;
}

@keyframes diskRotate {
  from { transform: rotateX(68deg) rotate(0deg); }
  to { transform: rotateX(68deg) rotate(360deg); }
}

.memory-labels {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;
  margin: 22px auto;
}

.memory-labels span {
  padding: 9px 14px;
  border: 1px solid #7560a8;
  border-radius: 25px;
  background: #151025;
}

/* SLOW SPACE JOURNEY */

#travel {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 10;
  background: #010008;
  overflow: hidden;
  perspective: 650px;
}

#travelWorld {
  position: absolute;
  inset: -40%;
  transform-style: preserve-3d;
}

.tunnel {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: repeating-radial-gradient(
    ellipse at center,
    transparent 0 30px,
    #a17aff44 32px,
    #ff9e6533 35px,
    transparent 38px 64px
  );
  animation: travelForward 7s linear infinite;
}

.tunnel.two {
  inset: 10%;
  opacity: .7;
  animation-duration: 10s;
  animation-direction: reverse;
}

@keyframes travelForward {
  from { transform: scale(.6) rotate(0deg); }
  to { transform: scale(1.8) rotate(110deg); }
}

#travelWorld.turnLeft {
  animation: leftTurn 4s ease-in-out;
}

#travelWorld.turnRight {
  animation: rightTurn 4s ease-in-out;
}

@keyframes leftTurn {
  0% { transform: rotate(0) scale(1); }
  45% { transform: rotate(-20deg) scale(1.08); }
  100% { transform: rotate(-360deg) scale(1.15); }
}

@keyframes rightTurn {
  0% { transform: rotate(0) scale(1); }
  45% { transform: rotate(20deg) scale(1.08); }
  100% { transform: rotate(360deg) scale(1.15); }
}

#travelShade {
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse,transparent 5%,#0004 55%,#000 100%);
}

#travelMessage {
  position: absolute;
  top: 50%;
  left: 50%;
  width: min(90%,650px);
  transform: translate(-50%,-50%);
  padding: 18px;
  text-align: center;
}

#chapter {
  color: #bca7ff;
  font-size: 12px;
  letter-spacing: 3px;
}

#messageTitle {
  font-size: clamp(25px,5vw,40px);
  line-height: 1.5;
  text-shadow: 0 0 25px #9c4cff;
}

#messageText {
  color: #e3dcf7;
  font-size: clamp(16px,2.6vw,20px);
  line-height: 2;
}

#messageCounter {
  color: #a99acb;
  font-size: 12px;
  margin: 22px;
}

.messageIn {
  animation: appear 1s ease;
}

@keyframes appear {
  from { opacity: 0; filter: blur(10px); }
  to { opacity: 1; filter: blur(0); }
}

#memoryPage {
  display: none;
  opacity: 0;
  min-height: 100vh;
  padding: 30px 15px;
  text-align: center;
}

#memoryPage.arrive {
  animation: arrive 2s ease forwards;
}

@keyframes arrive {
  from { opacity: 0; transform: scale(.84); filter: blur(12px); }
  to { opacity: 1; transform: scale(1); filter: blur(0); }
}

.memoryCard {
  max-width: 720px;
  margin: 25px auto;
  padding: 20px;
  border: 1px solid #8066c7;
  border-radius: 23px;
  background: #100c25ed;
  box-shadow: 0 0 40px #753cff33;
}

#memoryPhoto {
  width: 100%;
  max-height: 65vh;
  object-fit: contain;
  border-radius: 15px;
  margin: 15px auto;
  background: #05040a;
}

#photoStatus, #memoryMessage {
  line-height: 2;
  color: #e0d7ff;
}

.hidden { display: none !important; }

footer {
  color: #aaa0cf;
  margin-top: 28px;
  font-size: 13px;
}

@media(max-width:480px) {
  .portal { height: 310px; }
  .blackhole { transform: scale(.82); }
  .lens { transform: rotateX(68deg) rotate(-18deg) scale(.85); }
  .memoryCard { padding: 12px; }
}
</style>
</head>
