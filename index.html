
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Family Galaxy – A Universe of Love</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  min-height: 100%;
  overflow-x: hidden;
  background: #02030c;
  color: white;
  font-family: Arial, sans-serif;
}

body {
  overflow: hidden;
}

#space {
  position: fixed;
  inset: 0;
  overflow: hidden;
  background: radial-gradient(ellipse at center, #17164a 0%, #080b24 48%, #02030c 100%);
}

#stars, #meteors {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.star {
  position: absolute;
  background: white;
  border-radius: 50%;
  animation: twinkle 2s infinite alternate;
}

@keyframes twinkle {
  from { opacity: .2; }
  to { opacity: 1; }
}

.meteor {
  position: absolute;
  width: 190px;
  height: 3px;
  background: linear-gradient(90deg, transparent, #8df5ff, white);
  box-shadow: 0 0 15px #56dfff, 0 0 30px #278dff;
  transform: rotate(-35deg);
  animation: shoot 1.2s linear forwards;
}

@keyframes shoot {
  0% {
    opacity: 0;
    transform: translate(0,0) rotate(-35deg);
  }
  15% { opacity: 1; }
  100% {
    opacity: 0;
    transform: translate(-700px,700px) rotate(-35deg);
  }
}

#burst {
  position: absolute;
  width: 20px;
  height: 20px;
  left: 50%;
  top: 50%;
  transform: translate(-50%,-50%);
  border-radius: 50%;
  background: white;
  opacity: 0;
  z-index: 5;
  pointer-events: none;
}

#burst.active {
  animation: flash 1.5s ease-out forwards;
}

@keyframes flash {
  0% {
    opacity: 0;
    transform: translate(-50%,-50%) scale(.1);
  }
  15% {
    opacity: 1;
    transform: translate(-50%,-50%) scale(3);
    box-shadow: 0 0 100px 70px #8ceeff;
  }
  100% {
    opacity: 0;
    transform: translate(-50%,-50%) scale(35);
    box-shadow: 0 0 100px 70px #315cff;
  }
}

.ring {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 20px;
  height: 20px;
  border: 3px solid #9bf5ff;
  border-radius: 50%;
  transform: translate(-50%,-50%);
  opacity: 0;
  z-index: 4;
  pointer-events: none;
}

.ring.active {
  animation: ring 2s ease-out forwards;
}

@keyframes ring {
  0% {
    width: 20px;
    height: 20px;
    opacity: 1;
    border-width: 8px;
    box-shadow: 0 0 40px #48dfff;
  }
  100% {
    width: 180vmax;
    height: 180vmax;
    opacity: 0;
    border-width: 1px;
  }
}

/* INTRO */

#intro {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  text-align: center;
  z-index: 3;
  transition: opacity 1.5s;
  pointer-events: none;
}

#intro h1 {
  font-size: clamp(30px,7vw,75px);
  letter-spacing: 5px;
  text-shadow: 0 0 20px #58dfff, 0 0 50px #375dff;
}

#intro p {
  margin-top: 18px;
  letter-spacing: 4px;
  color: #a8dfff;
  font-size: clamp(12px,2vw,18px);
}

/* MAIN GALAXY */

#journey {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  text-align: center;
  padding: 25px;
  opacity: 0;
  visibility: hidden;
  transition: opacity 2s;
  z-index: 2;
}

#journey.show {
  opacity: 1;
  visibility: visible;
}

#journey h2 {
  font-size: clamp(30px,6vw,65px);
  color: #b8eaff;
  text-shadow: 0 0 25px #398cff;
  margin-bottom: 20px;
}

#journey p {
  max-width: 650px;
  font-size: clamp(15px,2.5vw,21px);
  line-height: 1.8;
  color: #e2eaff;
}

.planets {
  display: flex;
  gap: clamp(12px,4vw,40px);
  flex-wrap: wrap;
  justify-content: center;
  margin-top: 45px;
}

.planet {
  width: clamp(90px,17vw,145px);
  height: clamp(90px,17vw,145px);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 10px;
  font-size: clamp(12px,2vw,17px);
  font-weight: bold;
  cursor: pointer;
  border: 1px solid #a5dfff;
  box-shadow: 0 0 25px #398cff, inset 0 0 25px #315dff;
  transition: transform .4s, box-shadow .4s;
  animation: float 4s ease-in-out infinite;
}

.planet:nth-child(1) {
  background: radial-gradient(circle at 30% 30%,#a7eaff,#3455a9 45%,#090d35);
}

.planet:nth-child(2) {
  background: radial-gradient(circle at 30% 30%,#ffe0a3,#b65e65 45%,#32123e);
  animation-delay: .5s;
}

.planet:nth-child(3) {
  background: radial-gradient(circle at 30% 30%,#c8ffdf,#318b8a 45%,#092b43);
  animation-delay: 1s;
}

.planet:nth-child(4) {
  background: radial-gradient(circle at 30% 30%,#ffe6bd,#a16cce 45%,#25164b);
  animation-delay: 1.5s;
}

.planet:hover {
  transform: scale(1.18);
  box-shadow: 0 0 55px #8deaff;
}

@keyframes float {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-12px); }
}

/* MEMORY SCENES */

#memory-scene {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  text-align: center;
  padding: 25px;
  background: radial-gradient(circle,#263d83 0%,#101638 45%,#02030c 100%);
  opacity: 0;
  visibility: hidden;
  transform: scale(.1);
  transition: opacity 1s ease, transform 1s ease, visibility 1s;
  overflow-y: auto;
}

#memory-scene.open {
  opacity: 1;
  visibility: visible;
  transform: scale(1);
}

#memory-scene h2 {
  font-size: clamp(35px,7vw,65px);
  color: #b8eaff;
  text-shadow: 0 0 25px #398cff;
  margin-bottom: 20px;
}

#memory-scene p {
  max-width: 650px;
  font-size: clamp(16px,3vw,22px);
  line-height: 1.8;
  color: white;
}

#back-galaxy, #restart {
  margin-top: 35px;
  padding: 13px 28px;
  border: 1px solid #8deaff;
  background: transparent;
  color: white;
  border-radius: 30px;
  cursor: pointer;
  letter-spacing: 2px;
}

#back-galaxy:hover, #restart:hover {
  background: #2456a5;
}

@media(max-width:600px) {
  #journey {
    padding: 15px;
  }

  .planets {
    gap: 15px;
    margin-top: 30px;
  }

  .planet {
    width: 105px;
    height: 105px;
  }
}
</style>
</head>

<body>

<div id="space">

  <div id="stars"></div>
  <div id="meteors"></div>

  <div id="burst"></div>
  <div class="ring" id="ring"></div>

  <!-- AUTOMATIC INTRO -->

  <section id="intro">
    <h1>OUR FAMILY GALAXY</h1>
    <p>A UNIVERSE OF LOVE</p>
  </section>

  <!-- MAIN GALAXY -->

  <section id="journey">

    <h2>Welcome to Our Universe ✨</h2>

    <p>
      Every star holds a memory. Every planet tells a story.
      Travel through our little universe, where love is endless
      and our family is the brightest galaxy.
    </p>

    <div class="planets">

      <div class="planet" data-memory="AAI">
        AAI ❤️
      </div>

      <div class="planet" data-memory="BABA">
        BABA 💙
      </div>

      <div class="planet" data-memory="CHILDHOOD">
        CHILDHOOD 🌟
      </div>

      <div class="planet" data-memory="FAMILY">
        FAMILY 🌌
      </div>

    </div>

    <button id="restart">
      REPLAY GALAXY OPENING
    </button>

  </section>

</div>

<!-- MEMORY SCREEN -->

<section id="memory-scene">

  <h2 id="memory-title"></h2>

  <p id="memory-text"></p>

  <button id="back-galaxy">
    ← BACK TO OUR GALAXY
  </button>

</section>

<script>

/* CREATE STARS */

const stars = document.getElementById("stars");

for (let i = 0; i < 180; i++) {

  const star = document.createElement("span");

  star.className = "star";

  star.style.left = Math.random() * 100 + "%";
  star.style.top = Math.random() * 100 + "%";

  const size = Math.random() * 3 + 1;

  star.style.width = size + "px";
  star.style.height = size + "px";

  star.style.animationDelay = Math.random() * 3 + "s";

  stars.appendChild(star);
}


/* METEOR ANIMATION */

const meteors = document.getElementById("meteors");

function shootMeteor() {

  const meteor = document.createElement("div");

  meteor.className = "meteor";

  meteor.style.left = (Math.random() * 120 + 10) + "%";
  meteor.style.top = (Math.random() * 65 - 10) + "%";

  meteors.appendChild(meteor);

  setTimeout(() => {
    meteor.remove();
  }, 1300);
}


/* MEMORY DATA */

const memories = {

  AAI: {
    title: "For Our Aai ❤️",
    text: "The heart of our universe. Your love makes every corner of our galaxy feel like home. You are the warmth behind every beautiful memory."
  },

  BABA: {
    title: "For Our Baba 💙",
    text: "Our strength, our guide, and the star that always lights our way. Your support makes our universe stronger every day."
  },

  CHILDHOOD: {
    title: "Our Childhood 🌟",
    text: "A collection of little moments, endless laughter, silly fights and memories that will stay with us forever."
  },

  FAMILY: {
    title: "Our Beautiful Family 🌌",
    text: "Different souls, one beautiful universe. Through every moment, every journey and every memory, together we are home."
  }

};


/* ELEMENTS */

const intro = document.getElementById("intro");
const journey = document.getElementById("journey");
const burst = document.getElementById("burst");
const ring = document.getElementById("ring");
const memoryScene = document.getElementById("memory-scene");

let timers = [];


/* OPEN A PLANET */

document.querySelectorAll(".planet").forEach(planet => {

  planet.addEventListener("click", () => {

    const key = planet.dataset.memory;

    const memory = memories[key];

    if (!memory) return;

    document.getElementById("memory-title").textContent =
      memory.title;

    document.getElementById("memory-text").textContent =
      memory.text;

    journey.classList.remove("show");

    memoryScene.classList.add("open");

  });

});


/* BACK TO GALAXY */

document.getElementById("back-galaxy").addEventListener("click", () => {

  memoryScene.classList.remove("open");

  journey.classList.add("show");

});


/* AUTOMATIC GALAXY OPENING */

function clearTimers() {

  timers.forEach(timer => clearTimeout(timer));

  timers = [];

}


function startJourney() {

  clearTimers();

  memoryScene.classList.remove("open");

  journey.classList.remove("show");

  intro.style.opacity = "1";

  burst.classList.remove("active");

  ring.classList.remove("active");

  meteors.innerHTML = "";

  /* Shoot 22 meteors */

  for (let i = 0; i < 22; i++) {

    timers.push(
      setTimeout(shootMeteor, i * 150)
    );

  }

  /* Explosion */

  timers.push(setTimeout(() => {

    burst.classList.remove("active");
    ring.classList.remove("active");

    void burst.offsetWidth;

    burst.classList.add("active");
    ring.classList.add("active");

  }, 1900));


  /* Enter family galaxy */

  timers.push(setTimeout(() => {

    intro.style.opacity = "0";

    journey.classList.add("show");

  }, 3500));

}


/* REPLAY BUTTON */

document.getElementById("restart").addEventListener("click", startJourney);


/* START WHEN PAGE IS READY */

if (document.readyState === "loading") {

  document.addEventListener("DOMContentLoaded", startJourney, { once: true });

} else {

  startJourney();

}

</script>

</body>
</html>
