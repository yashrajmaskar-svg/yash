<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Universe of Memories</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  color: white;
  text-align: center;
  font-family: Arial, sans-serif;
  background: radial-gradient(circle, #251044, #080817 65%, #010105);
}

main {
  max-width: 850px;
  margin: auto;
  padding: 25px 16px;
}

h1 {
  font-size: clamp(30px, 6vw, 48px);
  letter-spacing: 3px;
  text-shadow: 0 0 20px #a65cff;
}

.subtitle { color: #d8ceff; line-height: 1.6; }

.stage {
  width: min(78vw, 340px);
  aspect-ratio: 1;
  margin: 25px auto;
  position: relative;
  display: grid;
  place-items: center;
}

.orbit {
  position: absolute;
  width: 100%;
  height: 40%;
  border: 5px solid #ff9e4a;
  border-left-color: #bd69ff;
  border-right-color: #6ceaff;
  border-radius: 50%;
  transform: rotate(-25deg);
  box-shadow: 0 0 20px #a34fff;
}

.orbit.two {
  width: 86%;
  height: 50%;
  border: 3px solid #8e70ff;
  transform: rotate(55deg);
}

.black-hole {
  width: 44%;
  aspect-ratio: 1;
  border-radius: 50%;
  background: radial-gradient(
    circle, #000 0 42%, #120821 52%,
    #ff8b3d 64%, #bd55ff 72%, transparent 79%
  );
  box-shadow: 0 0 35px #963cff, 0 0 70px #642cff;
}

.spinning .orbit {
  animation: spin 0.45s linear infinite;
}

.spinning .orbit.two {
  animation: spinBack 0.35s linear infinite;
}

.spinning .black-hole {
  animation: pulse 0.3s ease-in-out infinite alternate;
}

@keyframes spin {
  to { transform: rotate(335deg); }
}

@keyframes spinBack {
  to { transform: rotate(-305deg); }
}

@keyframes pulse {
  to { transform: scale(1.12); }
}

button {
  padding: 14px 26px;
  border: 1px solid #dfd0ff;
  border-radius: 30px;
  color: white;
  background: linear-gradient(90deg, #7139df, #ad40e8);
