
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Family Galaxy – A Universe of Love</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#02030c;color:white;font-family:Arial,sans-serif}
#space{position:fixed;inset:0;background:radial-gradient(ellipse at center,#17164a 0%,#080b24 42%,#02030c 100%);overflow:hidden}
#stars,#meteors{position:absolute;inset:0;pointer-events:none}
.star{position:absolute;background:white;border-radius:50%;animation:twinkle 2s infinite alternate}
@keyframes twinkle{from{opacity:.2}to{opacity:1}}
.meteor{position:absolute;width:180px;height:2px;background:linear-gradient(90deg,transparent,#8df5ff,#fff);box-shadow:0 0 12px #56dfff,0 0 25px #278dff;transform:rotate(-35deg);animation:shoot 1.1s linear forwards}
@keyframes shoot{0%{opacity:0;transform:translate(0,0) rotate(-35deg)}10%{opacity:1}100%{opacity:0;transform:translate(-650px,650px) rotate(-35deg)}}
#burst{position:absolute;width:20px;height:20px;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;background:white;opacity:0;z-index:5}
#burst.active{animation:flash 1.5s ease-out forwards}
@keyframes flash{0%{opacity:0;transform:translate(-50%,-50%) scale(.1);box-shadow:0 0 0 white}15%{opacity:1;transform:translate(-50%,-50%) scale(3);box-shadow:0 0 100px 70px #8ceeff}100%{opacity:0;transform:translate(-50%,-50%) scale(35);box-shadow:0 0 100px 70px #315cff}}
.ring{position:absolute;left:50%;top:50%;width:20px;height:20px;border:3px solid #9bf5ff;border-radius:50%;transform:translate(-50%,-50%);opacity:0;z-index:4}
.ring.active{animation:ring 2s ease-out forwards}
@keyframes ring{0%{width:20px;height:20px;opacity:1;border-width:8px;box-shadow:0 0 40px #48dfff}100%{width:180vmax;height:180vmax;opacity:0;border-width:1px}}
#intro{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;z-index:3;transition:opacity 1.5s}
#intro h1{font-size:clamp(30px,7vw,75px);letter-spacing:5px;text-shadow:0 0 20px #58dfff,0 0 50px #375dff}
#intro p{margin-top:18px;letter-spacing:4px;color:#a8dfff;font-size:clamp(12px,2vw,18px)}
#journey{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:25px;opacity:0;visibility:hidden;transition:opacity 2s;z-index:2}
#journey.show{opacity:1;visibility:visible}
#journey h2{font-size:clamp(30px,6vw,65px);color:#b8eaff;text-shadow:0 0 25px #398cff;margin-bottom:20px}
#journey p{max-width:650px;font-size:clamp(15px,2.5vw,21px);line-height:1.8;color:#e2eaff}
.planets{display:flex;gap:clamp(12px,4vw,40px);flex-wrap:wrap;justify-content:center;margin-top:45px}
.planet{width:clamp(90px,17vw,145px);height:clamp(90px,17vw,145px);border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;font-size:clamp(12px,2vw,17px);font-weight:bold;cursor:pointer;border:1px solid #a5dfff;box-shadow:0 0 25px #398cff,inset 0 0 25px #315dff;transition:.3s;background:radial-gradient(circle at 30% 30%,#a7eaff,#3455a9 45%,#090d35)}
.planet:nth-child(2){background:radial-gradient(circle at 30% 30%,#ffe0a3,#b65e65 45%,#32123e)}
.planet:nth-child(3){background:radial-gradient(circle at 30% 30%,#c8ffdf,#318b8a 45%,#092b43)}
.planet:nth-child(4){background:radial-gradient(circle at 30% 30%,#ffe6bd,#a16cce 45%,#25164b)}
.planet:hover{transform:scale(1.15);box-shadow:0 0 45px #8deaff}
#message{margin-top:25px;min-height:50px;color:#bceaff;font-size:18px;line-height:1.6}
#restart{margin-top:25px;background:transparent;border:1px solid #7deaff;color:white;padding:12px 25px;border-radius:30px;cursor:pointer;letter-spacing:2px}
#restart:hover{background:#2456a5}
@media(max-width:600px){.planets{gap:12px}.planet{width:95px;height:95px}}
</style>
</head>

<body>
<div id="space">
  <div id="stars"></div>
  <div id="meteors"></div>
  <div id="burst"></div>
  <div class="ring" id="ring"></div>

  <section id="intro">
    <h1>OUR FAMILY GALAXY</h1>
    <p>A UNIVERSE OF LOVE</p>
  </section>

  <section id="journey">
    <h2>Welcome to Our Universe ✨</h2>
    <p>
      Every star holds a memory. Every planet tells a story.
      Travel through our little universe, where love is endless
      and our family is the brightest galaxy.
    </p>

    <div class="planets">
      <div class="planet" onclick="showMemory('Aai ❤️','The heart of our universe. Your love makes every corner of our galaxy feel like home.')">AAI</div>
      <div class="planet" onclick="showMemory('Baba 💙','Our strength, our guide, and the star that always lights our way.')">BABA</div>
      <div class="planet" onclick="showMemory('Childhood 🌟','A collection of little moments, endless laughter, and memories that never fade.')">CHILDHOOD</div>
      <div class="planet" onclick="showMemory('Our Family 🌌','Different souls, one beautiful universe. Together, we are home.')">FAMILY</div>
    </div>

    <div id="message">✨ Select a planet to explore its memory ✨</div>
    <button id="restart" onclick="startJourney()">REPLAY GALAXY OPENING</button>
  </section>
</div>

<script>
const stars=document.getElementById('stars');
const meteors=document.getElementById('meteors');
const burst=document.getElementById('burst');
const ring=document.getElementById('ring');
const intro=document.getElementById('intro');
const journey=document.getElementById('journey');

for(let i=0;i<180;i++){
  const s=document.createElement('span');
  s.className='star';
  s.style.left=Math.random()*100+'%';
  s.style.top=Math.random()*100+'%';
  const size=Math.random()*3+1;
  s.style.width=size+'px';
  s.style.height=size+'px';
  s.style.animationDelay=Math.random()*3+'s';
  stars.appendChild(s);
}

function shootMeteor(){
  const m=document.createElement('div');
  m.className='meteor';
  m.style.left=(Math.random()*120+10)+'%';
  m.style.top=(Math.random()*65-10)+'%';
  meteors.appendChild(m);
  setTimeout(()=>m.remove(),1200);
}

function showMemory(title,text){
  document.getElementById('message').innerHTML=
    '<strong>'+title+'</strong><br>'+text;
}

let timers=[];
function clearTimers(){timers.forEach(clearTimeout);timers=[]}

function startJourney(){
  clearTimers();
  journey.classList.remove('show');
  intro.style.opacity='1';
  burst.classList.remove('active');
  ring.classList.remove('active');
  meteors.innerHTML='';
  document.getElementById('message').textContent='✨ Select a planet to explore its memory ✨';

  // Meteors start automatically
  for(let i=0;i<18;i++){
    timers.push(setTimeout(shootMeteor,i*180));
  }

  // Big galaxy explosion
  timers.push(setTimeout(()=>{
    burst.classList.remove('active');
    ring.classList.remove('active');
    void burst.offsetWidth;
    burst.classList.add('active');
    ring.classList.add('active');
  },1900));

  // Reveal the family journey
  timers.push(setTimeout(()=>{
    intro.style.opacity='0';
    journey.classList.add('show');
  },3400));
}

window.addEventListener('load',startJourney);
if(document.readyState==='complete')startJourney();
</script>
</body>
</html>
