```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Universe of Memories</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  background: radial-gradient(ellipse at center, #17102f, #050510 60%, #000);
  overflow-x: hidden;
}

.stars {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-image:
    radial-gradient(2px 2px at 20px 30px, white, transparent),
    radial-gradient(1px 1px at 100px 80px, white, transparent),
    radial-gradient(2px 2px at 180px 160px, #a8d8ff, transparent),
    radial-gradient(1px 1px at 250px 50px, white, transparent),
    radial-gradient(2px 2px at 300px 200px, #d7baff, transparent);
  background-size: 350px 250px;
  animation: starsMove 35s linear infinite;
}

@keyframes starsMove {
  from { transform: translateY(0); }
  to { transform: translateY(-250px); }
}

main {
  position: relative;
  z-index: 1;
  padding: 25px 15px 40px;
}

h1 {
  font-size: clamp(30px, 6vw, 48px);
  text-shadow: 0 0 20px #9b70ff;
}

.subtitle {
  color: #d0c9f5;
}

.universe {
  height: 320px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

.blackhole {
  width: 135px;
  height: 135px;
  border-radius: 50%;
  background: #000;
  position: relative;
  z-index: 2;
  box-shadow:
    0 0 20px 8px #ff6cdd,
    0 0 45px 20px #7b4dff,
    0 0 90px 35px #3020b8;
}

.blackhole::before {
  content: "";
  position: absolute;
  inset: -20px;
  border-radius: 50%;
  border: 7px solid transparent;
  border-top-color: #ffb0ee;
  border-bottom-color: #6bdcff;
  filter: drop-shadow(0 0 10px #a15cff);
}

.blackhole::after {
  content: "";
  position: absolute;
  inset: -34px;
  border-radius: 50%;
  border: 2px solid #8768ff;
  transform: scaleY(.45) rotate(35deg);
}

.orbit {
  position: absolute;
  width: 250px;
  height: 90px;
  border: 1px solid #987bff99;
  border-radius: 50%;
  transform: rotate(-25deg);
}

.orbit.two {
  width: 300px;
  height: 120px;
  transform: rotate(35deg);
  border-color: #ff71dd77;
}

.spinning {
  animation: spin 1s linear infinite;
}

@keyframes spin {
  from { transform: rotate(0deg) scale(1); }
  to { transform: rotate(720deg) scale(1.08); }
}

button {
  padding: 14px 25px;
  margin: 8px;
  border: none;
  border-radius: 30px;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  background: linear-gradient(90deg, #763cff, #e13ecb);
  box-shadow: 0 0 20px #773dff66;
}

button:hover {
  box-shadow: 0 0 28px #c34cff;
}

button:disabled {
  opacity: .6;
  cursor: wait;
}

.memory-options {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
  margin: 25px auto;
}

.memory-chip {
  border: 1px solid #7770bc;
  border-radius: 22px;
  padding: 10px 15px;
  color: #e0dcff;
  background: #17142e;
}

#memoryPage {
  display: none;
}

.memory-card {
  max-width: 650px;
  margin: 25px auto;
  padding: 20px;
  border: 1px solid #6553b7;
  border-radius: 22px;
  background: #12102bea;
  box-shadow: 0 0 35px #643fff33;
}

#memoryPhoto {
  width: 100%;
  max-height: 430px;
  object-fit: contain;
  border-radius: 14px;
  margin: 15px auto;
  background: #080713;
}

.hidden {
  display: none !important;
}

#photoMessage {
  color: #d0c9f5;
  line-height: 1.7;
}

footer {
  margin-top: 35px;
  color: #a6a0c8;
  font-size: 13px;
}

@media (max-width: 480px) {
  .universe { height: 280px; }
  .blackhole { width: 110px; height: 110px; }
  .orbit { width: 210px; }
  .orbit.two { width: 250px; }
}
</style>
</head>

<body>
<div class="stars"></div>

<main>
  <section id="home">
    <h1>🌌 Universe of Memories</h1>
    <p class="subtitle">One universe. Four memories. Infinite feelings.</p>

    <div class="universe">
      <div class="orbit"></div>
      <div class="orbit two"></div>
      <div class="blackhole" id="blackhole"></div>
    </div>

    <button id="spinButton" onclick="spin()">
      🌀 SPIN THE BLACK HOLE
    </button>

    <div class="memory-options">
      <span class="memory-chip">🌈 Childhood</span>
      <span class="memory-chip">👨 Father</span>
      <span class="memory-chip">👩 Mother</span>
      <span class="memory-chip">❤️ Family</span>
    </div>

    <p id="status">Spin the black hole to discover a memory!</p>
  </section>

  <section id="memoryPage">
    <h1 id="memoryTitle">Your Memory</h1>
    <p class="subtitle" id="memorySubtitle"></p>

    <div class="memory-card">
      <img id="memoryPhoto" class="hidden" alt="Memory photo">
      <p id="photoMessage"></p>
      <button onclick="goHome()">🌌 Back to Universe</button>
    </div>
  </section>

  <footer>✨ Every memory is a star in your universe ✨</footer>
</main>

<script>
const memories = [
  {
    name: "Childhood",
    emoji: "🌈",
    title: "The Magic of Childhood",
    message: "Those little moments, innocent smiles, and happy days will always have a special place in your heart.",
    files: ["childhood.jpg"]
  },
  {
    name: "Father",
    emoji: "👨",
    title: "My First Hero — Father",
    message: "A father's love, support, and sacrifices make him one of the most special people in our lives.",
    files: ["father.jpg"]
  },
  {
    name: "Mother",
    emoji: "👩",
    title: "A Mother's Endless Love",
    message: "A mother's love brings comfort, strength, and warmth that stays with us wherever life takes us.",
    files: ["mother.jpg"]
  },
  {
    name: "Family",
    emoji: "❤️",
    title: "My Beautiful Family",
    message: "Family is where love begins, memories grow, and the heart always finds its way home.",
    files: ["family.jpg"]
  }
];

let spinning = false;
let chosenMemory = null;

function spin() {
  if (spinning) return;

  spinning = true;

  const button = document.getElementById("spinButton");
  const hole = document.getElementById("blackhole");
  const status = document.getElementById("status");

  button.disabled = true;
  hole.classList.add("spinning");
  status.textContent = "The universe is choosing your memory...";

  let ticks = 0;

  const interval = setInterval(() => {
    const preview = memories[
      Math.floor(Math.random() * memories.length)
    ];

    status.textContent = preview.emoji + " " + preview.name + "...";
    ticks++;

    if (ticks >= 15) {
      clearInterval(interval);
      hole.classList.remove("spinning");
      button.disabled = false;
      spinning = false;

      const selected = memories[
        Math.floor(Math.random() * memories.length)
      ];

      openMemory(selected);
    }
  }, 180);
}

function openMemory(memory) {
  chosenMemory = memory;

  document.getElementById("home").style.display = "none";
  document.getElementById("memoryPage").style.display = "block";

  document.getElementById("memoryTitle").textContent =
    memory.emoji + " " + memory.title;

  document.getElementById("memorySubtitle").textContent =
    "Your universe has chosen: " + memory.name;

  const photo = document.getElementById("memoryPhoto");
  const message = document.getElementById("photoMessage");

  photo.classList.add("hidden");
  photo.removeAttribute("src");
  message.textContent = memory.message;

  photo.onload = function() {
    photo.classList.remove("hidden");
  };

  photo.onerror = function() {
    photo.classList.add("hidden");
    message.textContent =
      memory.message +
      " Please check that the photo '" +
      memory.files[0] +
      "' exists in your GitHub repository beside index.html.";
  };

  photo.src = memory.files[0];
}

function goHome() {
  document.getElementById("memoryPage").style.display = "none";
  document.getElementById("home").style.display = "block";

  document.getElementById("status").textContent =
    "Welcome back! Spin again to discover another memory.";

  chosenMemory = null;
}
</script>
</body>
</html>
```
